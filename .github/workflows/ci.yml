name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    name: Compilar y probar (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      # si falla una versión de Java, la otra termina igual y se ve cuál falló
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Maven descargado por mvnw: se reutiliza entre ejecuciones en lugar de bajarlo cada vez
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Compilar y ejecutar las pruebas
        run: ./mvnw -B verify
